# The checks that need no simulator, on each push to main and each pull request: the same lanes
# as on a developer Mac (script/test.sh unit, script/test.sh build).
# The UI journeys (script/test.sh journey) are NOT part of CI. They need a booted simulator
# ($BEGIAI_SIM) and run on a developer Mac.
name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The project file (project.xcproj) and the code need Xcode 27, which the macos-26 image does
# not have (its newest is 26.6). The xcode-27 image (public preview) has 27.2, the version the
# app is built with, but selects 27.1 by default, so DEVELOPER_DIR picks 27.2.
# The "Show the toolchain" step prints it, so a log shows which Xcode ran.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  unit:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Make sure timeout exists
        # script/test.sh calls timeout; the GNU one comes with coreutils.
        run: |
          if ! command -v timeout > /dev/null; then
            brew list coreutils > /dev/null 2>&1 || brew install coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          fi
      - name: Unit tests (headless swift test in BegiaiKit)
        run: script/test.sh unit

      - name: Show the lane's log when it fails
        if: failure()
        run: |
          for log in "$HOME"/Library/Caches/Begiai/*/runs/unit.log; do
            echo "== $log"; tail -n 150 "$log"
          done

  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Make sure timeout exists
        run: |
          if ! command -v timeout > /dev/null; then
            brew list coreutils > /dev/null 2>&1 || brew install coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          fi
      - name: Release build, unsigned, and the release checks
        run: script/test.sh build

      - name: Show the lane's log when it fails
        if: failure()
        run: |
          for log in "$HOME"/Library/Caches/Begiai/*/runs/build.log; do
            echo "== $log"; tail -n 150 "$log"
          done
